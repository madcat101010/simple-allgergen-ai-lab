apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcdonalds-allergen-agent
  labels:
    app: mcdonalds-allergen-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcdonalds-allergen-agent
  template:
    metadata:
      labels:
        app: mcdonalds-allergen-agent
    spec:
      containers:
      - name: allergen-agent
        image: gcr.io/mcdonalds-allergen-lab/mcdonalds-allergen-ai-agent:latest
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: mcdonalds-allergen-secrets
              key: gemini-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcdonalds-allergen-agent-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
  selector:
    app: mcdonalds-allergen-agent
